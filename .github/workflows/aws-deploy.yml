name: Build and deploy to AWS ECS Express Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, lint and build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Preserve current container configuration
        run: |
          aws ecs describe-express-gateway-service \
            --service-arn "arn:aws:ecs:ap-south-1:904233105357:service/default/cloudnote-aws" \
            --query "service.activeConfigurations[0].primaryContainer" \
            --output json > primary-container.json

          jq --arg image "$IMAGE_URI" \
            '.image = $image' \
            primary-container.json > updated-primary-container.json

      - name: Deploy to ECS Express Mode
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "arn:aws:ecs:ap-south-1:904233105357:service/default/cloudnote-aws" \
            --primary-container file://updated-primary-container.json \
            --region "${{ secrets.AWS_REGION }}" \
            --monitor-resources DEPLOYMENT