services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudnote
      POSTGRES_USER: cloudnote
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnote -d cloudnote"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cloudnote:localdevpassword@db:5432/cloudnote
      PGSSL: "false"
      CLOUD_PROVIDER: local-docker
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
